name: Test basic usage (default token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert SBOM generated, or failed gracefully on the sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.fileName }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but fileName output is empty"
              exit 1
            fi
            case "$RESULT" in
              sbom-*-"$GITHUB_SHA".json) ;;
              *) echo "FAIL: fileName '$RESULT' does not match sbom-<owner>-<repo>-<sha>.json"; exit 1 ;;
            esac
            if [ ! -s "$RESULT" ]; then
              echo "FAIL: SBOM file '$RESULT' missing or empty"
              exit 1
            fi
            if ! grep -q 'spdxVersion' "$RESULT"; then
              echo "FAIL: SBOM file does not look like SPDX JSON"
              head -c 500 "$RESULT"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set fileName output"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
