name: Test explicit token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert SBOM generated, or failed gracefully on the sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.fileName }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but fileName output is empty"
              exit 1
            fi
            case "$RESULT" in
              sbom-*.json) ;;
              *) echo "FAIL: unexpected fileName format '$RESULT'"; exit 1 ;;
            esac
            if [ ! -s "$GITHUB_WORKSPACE/$RESULT" ]; then
              echo "FAIL: SBOM file '$RESULT' missing or empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set fileName output"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
